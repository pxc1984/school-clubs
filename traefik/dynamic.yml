http:
  routers:
    backend:
      rule: "PathPrefix(`/api`) || PathPrefix(`/scalar`) || PathPrefix(`/openapi`)"
      entryPoints:
        - web
      priority: 100
      service: backend

    frontend:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - web
      priority: 1
      service: frontend

  services:
    backend:
      loadBalancer:
        servers:
          - url: "http://backend:8080"

    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:5173"
