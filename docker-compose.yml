services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command: [ "--configFile=/etc/traefik/traefik.yml" ]
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./traefik:/etc/traefik:ro,Z
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "traefik", "healthcheck", "--ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-db}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-db}" ]
      interval: 3s
      timeout: 1s
      retries: 10
      start_period: 5s

  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    ports:
      - "${S3_PORT:-9000}:9000"
    environment:
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${S3_SECRET_KEY:-rustfsadmin}
    volumes:
      - s3_data:/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1" ]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      # nuget.org is unreachable via the default bridge on some networks;
      # building on the host network matches local dotnet restore behavior
      network: host
    restart: unless-stopped
    environment:
      - Logging__LogLevel__Default=${Logging__LogLevel__Default:-Information}
      # собирается из POSTGRES_* — отдельно задавать строку подключения не нужно
      - ConnectionStrings__SchoolClubsDb=Server=db;Port=5432;Database=${POSTGRES_DB:-db};Username=${POSTGRES_USER:-admin};Password=${POSTGRES_PASSWORD:-password}
      - Auth__ServiceAdminPassword=${Auth__ServiceAdminPassword:-}
      - Auth__ConsentVersion=${Auth__ConsentVersion:-1}
      - Auth__Oidc__yandex__ClientId=${Auth__Oidc__yandex__ClientId:-}
      - Auth__Oidc__yandex__ClientSecret=${Auth__Oidc__yandex__ClientSecret:-}
      - Auth__Oidc__telegram__ClientId=${Auth__Oidc__telegram__ClientId:-}
      - Auth__Oidc__telegram__ClientSecret=${Auth__Oidc__telegram__ClientSecret:-}
      # файлы журналов (XLSX) — в S3-совместимом RustFS
      - Storage__S3__ServiceUrl=http://rustfs:9000
      - Storage__S3__AccessKey=${S3_ACCESS_KEY:-rustfsadmin}
      - Storage__S3__SecretKey=${S3_SECRET_KEY:-rustfsadmin}
      - Storage__S3__Bucket=${S3_BUCKET:-schoolclubs}
      # прокси перед бэкендом: 1 — только traefik, 2 — ещё nginx на хосте (реальный IP клиента)
      - ForwardedHeaders__ForwardLimit=${ForwardedHeaders__ForwardLimit:-1}
      # ключи шифрования cookie переживают пересоздание контейнера
      - DataProtection__KeysPath=/app/keys
    volumes:
      - dp_keys:/app/keys
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || exit 1" ]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      network: host
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=5173
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5173 || exit 1" ]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  db_data:
    driver: local
  dp_keys:
    driver: local
  s3_data:
    driver: local

networks:
  app-network:
    driver: bridge
