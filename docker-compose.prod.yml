# Поверх docker-compose.yml на сервере (dev и prod): готовые образы из GHCR вместо сборки.
# traefik слушает только 127.0.0.1:${HTTP_PORT}, туда проксирует хостовой nginx; RustFS наружу не публикуется.
# GITHUB_REPOSITORY_OWNER и COMMIT_SHA дописывает в .env деплой (.github/workflows/deploy.yml).
services:
  traefik:
    ports: !override
      - "127.0.0.1:${HTTP_PORT:-80}:80"

  # Порт БД для диагностики задаётся в ENV окружения: на dev DB_BIND=0.0.0.0, DB_PORT=59977.
  # Без них — случайный порт только на 127.0.0.1 (`docker compose port db 5432`, доступ через ssh-туннель).
  db:
    ports: !override
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-}:5432"

  rustfs:
    ports: !reset []

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/school-clubs-backend:${COMMIT_SHA}

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/school-clubs-frontend:${COMMIT_SHA}
